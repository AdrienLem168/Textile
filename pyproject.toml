[project]
name = "textile-waste-analyst"
version = "0.1.0"
description = "Rapport hebdomadaire sur les déchets textiles en Europe, France et Normandie (Mistral Workflow)"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/worker/tests"]
